<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 3 — Coupa Cyber Arcade</title>
<link rel="stylesheet" href="arcade.css">
<style>
  .stagehdr{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .pwfield{position:relative}
  .pwfield input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;padding:18px 60px 18px 18px;
    letter-spacing:.02em}
  .pwfield .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
  .meter{height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:14px}
  .meter i{display:block;height:100%;width:0;background:var(--grad-primary);transition:width .3s ease}
  .meter i.won{background:var(--grad-secondary)}
  .rig{background:#04122F;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:16px}
  .rig .rl{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  .rig .big{font-size:31px;font-weight:600;color:var(--robin);line-height:38px}
  .rig .big.won{color:var(--pistachio)}
  .rig .lbl{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)}
  .bits{display:flex;gap:3px;margin-top:12px;flex-wrap:wrap}
  .bits i{width:7px;height:18px;border-radius:2px;background:rgba(255,255,255,.12)}
  .bits i.on{background:var(--robin)}
  .bits i.tgt{background:var(--white)}
  .flags{display:grid;gap:7px;margin-top:14px}
  .flags .fg{font-size:13px;line-height:20px;padding:9px 12px;border-radius:8px;
    background:rgba(95,214,255,.09);border-left:3px solid var(--robin)}
  .flags .fg.good{background:rgba(150,234,170,.1);border-left-color:var(--pistachio)}
  .target{background:rgba(255,255,255,.05);border-radius:11px;padding:16px 19px;margin-bottom:16px}
  .target .t{font-size:20px;font-weight:500;line-height:28px}
  .target .c{font-size:14px;color:var(--dim);margin-top:5px}
  .assetcard{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:22px 24px}
  .assetcard .an{font-size:25px;font-weight:500;line-height:33px}
  .assetcard .ad{font-size:15px;color:var(--dim);margin-top:8px;line-height:24px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
  .grid4 .btn{padding:16px 8px;flex-direction:column;gap:3px;font-size:14px;line-height:18px;text-align:center}
  .grid4 .btn small{font-size:10px;font-weight:400;opacity:.7;letter-spacing:.02em}
  @media(max-width:700px){.grid4{grid-template-columns:1fr 1fr}}
  .acct{display:flex;gap:13px;align-items:center;background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;padding:14px 16px;cursor:pointer;transition:.14s;text-align:left;width:100%;
    font-family:var(--font);color:var(--white)}
  .acct:hover:not(:disabled){border-color:var(--robin);transform:translateX(3px)}
  .acct:disabled{cursor:default}
  .acct .ic{width:38px;height:38px;border-radius:10px;background:var(--royal);display:grid;place-items:center;
    font-size:17px;flex:none}
  .acct .t{flex:1;min-width:0}
  .acct .t b{display:block;font-weight:500;font-size:15px}
  .acct .t span{font-size:13px;color:var(--dim);font-family:ui-monospace,Menlo,monospace}
  .acct .st{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);flex:none}
  .acct.fell{border-color:var(--robin);background:rgba(95,214,255,.12)}
  .acct.fell .st{color:var(--robin)}
  .acct.safe{border-color:var(--pistachio);background:rgba(150,234,170,.1)}
  .acct.safe .st{color:var(--pistachio)}
  .acct.wrongpick{border-color:rgba(255,255,255,.3);opacity:.6}
  .acctlist{display:grid;gap:9px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div id="topbar"></div>
  <div id="start"></div>
  <div id="stage" class="hidden"></div>
  <div id="results" class="hidden"></div>
  <footer id="foot"></footer>
</div>

<script src="config.js"></script>
<script src="arcade.js"></script>
<script>
(function(){
'use strict';
var A = window.Arcade, esc = A.esc;

/* ============================================================
   PASSWORD ANALYSER — a compact token-based strength estimator.
   Splits the password into recognisable chunks (dictionary words,
   digit runs, keyboard walks, repeats) and only credits real
   entropy for the parts an attacker cannot guess cheaply.
   ============================================================ */

var WORDS = ('password admin welcome letmein monkey dragon football baseball basketball soccer sunshine princess'+
' shadow master qwerty login iloveyou trustno superman batman starwars pokemon summer winter spring autumn'+
' january february march april june july august september october november december monday friday'+
' january coupa company office finance invoice supplier vendor procurement payment purchase order'+
' january love happy lucky money secret secure private access system server network laptop mobile'+
' google apple microsoft amazon facebook twitter linkedin outlook gmail yahoo'+
' alexander michael christopher matthew joshua daniel andrew james robert john william david richard'+
' jennifer jessica ashley sarah emily michelle amanda melissa nicole elizabeth priya rahul singh patel'+
' cat dog bird fish horse tiger lion bear wolf eagle shark falcon dolphin panda'+
' red blue green yellow purple orange black white silver golden'+
' house home garden kitchen coffee pizza burger chocolate cookie banana apple orange mango grape'+
' guitar piano music movie book game player winner champion legend hero ninja wizard'+
' london paris tokyo berlin madrid rome dublin sydney toronto chicago boston austin denver miami'+
' california texas florida arizona nevada oregon virginia georgia'+
' spring2024 summer2024 winter2025 autumn2025 changeme default temp test user guest root'+
' happy birthday anniversary graduation wedding vacation holiday weekend'+
' rocket planet galaxy comet meteor nebula orbit saturn jupiter neptune'+
' river mountain forest ocean desert island valley canyon meadow thunder lightning storm'+
' silver copper bronze iron steel diamond emerald ruby sapphire crystal'+
' pencil stapler folder printer monitor keyboard'+
' one two three four five six seven eight nine ten').split(/\s+/).filter(Boolean);
var WORDSET = {}; WORDS.forEach(function(w){ WORDSET[w]=1; });
var MAXW = 0; WORDS.forEach(function(w){ if(w.length>MAXW) MAXW=w.length; });

var TOPPW = {'password':1,'123456':1,'123456789':1,'12345678':1,'qwerty':1,'password1':1,'password123':1,
  'abc123':1,'111111':1,'letmein':1,'welcome':1,'admin':1,'iloveyou':1,'monkey':1,'dragon':1,'qwerty123':1,
  'p@ssw0rd':1,'passw0rd':1,'welcome1':1,'summer2024':1,'coupa123':1,'changeme':1,'trustno1':1,'1q2w3e4r':1};

var LEET = {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','@':'a','$':'s','!':'i','|':'l','+':'t','(':'c'};
function deleet(s){ return s.toLowerCase().split('').map(function(ch){ return LEET[ch] || ch; }).join(''); }

var ROWS = ['`1234567890-=','qwertyuiop[]\\','asdfghjkl;\'','zxcvbnm,./',
            '~!@#$%^&*()_+','QWERTYUIOP{}|','ASDFGHJKL:"','ZXCVBNM<>?'];
function walkLen(s, i){
  // length of a keyboard/sequence run starting at i
  var best = 1;
  function runIn(seq){
    var p = seq.indexOf(s[i]); if (p < 0) return 1;
    var n = 1, dir = 0;
    for (var k = i+1; k < s.length; k++){
      var q = seq.indexOf(s[k]); if (q < 0) break;
      var d = q - p;
      if (Math.abs(d) !== 1) break;
      if (dir === 0) dir = d; else if (d !== dir) break;
      p = q; n++;
    }
    return n;
  }
  ROWS.forEach(function(r){ best = Math.max(best, runIn(r)); });
  best = Math.max(best, runIn('abcdefghijklmnopqrstuvwxyz'));
  best = Math.max(best, runIn('ABCDEFGHIJKLMNOPQRSTUVWXYZ'));
  best = Math.max(best, runIn('0123456789'));
  return best;
}

var WORD_BITS = 12.9;   // ~7,776-word list, as used by real cracking rigs
var GUESS_RATE = 1e10;  // 10 billion guesses/sec — a funded offline attack

function analyze(pw){
  var flags = [], bits = 0, i = 0, wordCount = 0, wordish = 0;
  if (!pw) return {bits:0, flags:[], seconds:0, wordCount:0};

  var low = pw.toLowerCase();
  if (TOPPW[low] || TOPPW[deleet(pw)]){
    return {bits:1, seconds:0, wordCount:0,
      flags:[{bad:1, t:'This is on every published breach list. It is guessed in the first second, whatever you substitute in it.'}]};
  }

  var classes = {lower:/[a-z]/.test(pw), upper:/[A-Z]/.test(pw), digit:/[0-9]/.test(pw), sym:/[^A-Za-z0-9]/.test(pw)};
  var charset = (classes.lower?26:0)+(classes.upper?26:0)+(classes.digit?10:0)+(classes.sym?33:0);
  var perChar = Math.log2(Math.max(charset,2));
  var dl = deleet(pw);
  var seenWords = [], seenPat = {};

  while (i < pw.length){
    // repeated character run
    var rep = 1; while (i+rep < pw.length && pw[i+rep] === pw[i]) rep++;
    if (rep >= 3){
      bits += 4 + Math.log2(rep); i += rep;
      if (!seenPat.rep){ seenPat.rep = 1; flags.push({bad:1, t:'Repeated characters ("'+esc(pw[i-1].repeat(Math.min(rep,6)))+'") add almost nothing — cracking tools generate runs first.'}); }
      continue;
    }
    // keyboard / alphabet / digit sequence
    var wl = walkLen(pw, i);
    if (wl >= 4){
      bits += 5 + Math.log2(wl); i += wl;
      if (!seenPat.walk){ seenPat.walk = 1; flags.push({bad:1, t:'Keyboard or alphabet run detected. "qwerty", "asdf", "1234", "abcd" are in the first few thousand guesses.'}); }
      continue;
    }
    // year
    var yr = pw.slice(i, i+4);
    if (/^(19[5-9]\d|20[0-4]\d)$/.test(yr)){
      bits += 7; i += 4;
      if (!seenPat.year){ seenPat.year = 1; flags.push({bad:1, t:'A four-digit year adds about 7 bits, not 13 — attackers try 1950–2049 before anything else. Birthdays and graduation years are worse still, because they are public.'}); }
      continue;
    }
    // dictionary word (longest match, leet-normalised)
    var found = null;
    for (var L = Math.min(MAXW, pw.length - i); L >= 4; L--){
      var cand = dl.slice(i, i+L);
      if (WORDSET[cand]){ found = {len:L, w:cand}; break; }
    }
    if (found){
      var chunk = pw.slice(i, i+found.len);
      var extra = 0;
      if (/[A-Z]/.test(chunk)) extra += 1.5;                      // capitalisation is predictable
      if (chunk.toLowerCase() !== deleet(chunk)) extra += 2;      // leet substitution is predictable
      bits += WORD_BITS + extra;
      wordCount++; seenWords.push(found.w);
      i += found.len; continue;
    }
    // a word-shaped run that isn't in the local list — real attackers use
    // word lists of hundreds of thousands of entries, so cap what it earns
    var al = 0; while (i+al < pw.length && /[a-zA-Z]/.test(pw[i+al])) al++;
    if (al >= 4){
      var seg = pw.slice(i, i+al);
      var vow = (seg.toLowerCase().match(/[aeiouy]/g) || []).length / al;
      if (vow >= 0.2 && vow <= 0.62){
        bits += Math.min(perChar*al, 14) + (/[A-Z]/.test(seg) ? 1.5 : 0);
        wordCount++; wordish++; i += al; continue;
      }
    }
    // spaces are predictable delimiters
    if (pw[i] === ' '){ bits += 1; i++; continue; }
    // digit run
    var dg = 0; while (i+dg < pw.length && /[0-9]/.test(pw[i+dg])) dg++;
    if (dg >= 2){ bits += dg * 3.32; i += dg; continue; }
    // unpredictable character
    bits += perChar; i++;
  }

  if (seenWords.length){
    flags.push({bad:1, t:'Recognised '+seenWords.length+' common word'+(seenWords.length>1?'s':'')+' ('+
      esc(seenWords.slice(0,4).join(', '))+'). Each one is worth about 13 bits, no matter how long it is — "elephant" is no stronger than "cat" to a word-list attack.'});
  }
  if (wordish){
    flags.push({bad:1, t:'Detected '+wordish+' more word-shaped chunk'+(wordish>1?'s':'')+
      '. Real cracking word lists run to hundreds of thousands of entries plus name and place lists, so a word caps out around 14 bits however obscure it feels. More words beats longer words.'});
  }
  if (pw.length >= 16 && !seenWords.length && !wordish){
    flags.push({bad:0, t:'Long and not built from common words — this is the shape that actually resists cracking.'});
  }
  if (pw.length >= 20 && wordCount >= 4){
    flags.push({bad:0, t:'A long passphrase. Length is doing the heavy lifting here, which is exactly right — just make the words unusual ones.'});
  }
  if (classes.lower && classes.upper && classes.digit && classes.sym && pw.length < 12){
    flags.push({bad:1, t:'All four character types, but short. Length beats variety: 16 lowercase letters outlast 9 mixed characters comfortably.'});
  }
  if (/^[A-Z][a-z]+[0-9]{1,4}[!@#$]?$/.test(pw)){
    flags.push({bad:1, t:'Capital, word, digits, symbol — the shape almost every password policy produces. Cracking rules model it explicitly.'});
  }

  var seconds = Math.pow(2, bits) / 2 / GUESS_RATE;
  return {bits:bits, flags:flags, seconds:seconds, wordCount:wordCount};
}

function fmtTime(s){
  if (s < 1) return 'instantly';
  if (s < 60) return Math.round(s)+' seconds';
  if (s < 3600) return Math.round(s/60)+' minutes';
  if (s < 86400) return Math.round(s/3600)+' hours';
  if (s < 2.6e6) return Math.round(s/86400)+' days';
  if (s < 3.15e7) return Math.round(s/2.6e6)+' months';
  var y = s/3.15e7;
  if (y < 1e3) return Math.round(y).toLocaleString()+' years';
  if (y < 1e6) return Math.round(y/1e3).toLocaleString()+' thousand years';
  if (y < 1e9) return (y/1e6).toPrecision(3)+' million years';
  if (y < 1e12) return (y/1e9).toPrecision(3)+' billion years';
  return 'longer than the age of the universe';
}

/* ================= STAGE 1 — CRACK LAB ================= */
var LEVELS = [
{ target: 3600, label:'Survive 1 hour',
  rule:'No restrictions. Just beat the clock.',
  check:function(){ return null; },
  teach:'Eight mixed characters used to be the standard. It now falls inside a working day — and inside an hour if any part of it is a word.' },
{ target: 3.15e9, label:'Survive 100 years',
  rule:'Maximum 14 characters. No common word may carry it.',
  check:function(pw){ return pw.length > 14 ? 'Maximum 14 characters — you are at '+pw.length+'.' : null; },
  teach:'When length is capped, unpredictability is all you have left. This is what a password manager generates for you, and why letting it do so is the entire point.' },
{ target: 3.15e8, label:'Survive 10 years',
  rule:'Lowercase letters and spaces only. At least four words.',
  check:function(pw){
    if (/[^a-z ]/.test(pw)) return 'Lowercase letters and spaces only.';
    if (pw.trim().split(/\s+/).filter(function(w){return w.length>1;}).length < 4) return 'At least four words, please.';
    return null; },
  teach:'No capitals, no digits, no symbols — and it still outlasts the mixed-character password you were taught to use. Length is the variable that matters, and unusual words beat long ones.' }
];

/* ================= STAGE 2 — CLASSIFY ================= */
var TIERS = {
  public:      {label:'Public',       sub:'Anyone, anywhere'},
  internal:    {label:'Internal',     sub:'All employees'},
  confidential:{label:'Confidential', sub:'Need-to-know'},
  restricted:  {label:'Restricted',   sub:'Named access, logged'}
};
var ASSETS = [
{ n:'The press release announcing last quarter\'s results', d:'Already published on the company website and wire services.',
  a:'public', why:'Published means public. Treating public information as secret wastes the classification system\'s credibility.' },
{ n:'A spreadsheet of customer contacts, contract values and renewal dates', d:'Exported from the CRM to build a renewal forecast.',
  a:'confidential', why:'Personal data plus commercial terms. Need-to-know, encrypted at rest, and it should not have been exported to a local file in the first place.' },
{ n:'The all-hands slide deck on next quarter\'s priorities', d:'Shared with every employee on the intranet.',
  a:'internal', why:'Everyone inside should see it; nobody outside should. That is precisely what Internal means.' },
{ n:'Employee bank details for payroll', d:'Held in the payroll system for salary payments.',
  a:'restricted', why:'The highest tier: named individuals only, every access logged. Financial account data attracts both attackers and regulators.' },
{ n:'The office lunch menu for this week', d:'Pinned in the kitchen and the facilities channel.',
  a:'public', why:'No harm in disclosure. Over-classifying trivia is how people learn to ignore labels.' },
{ n:'Penetration test report with unpatched findings', d:'Delivered by the external testers last month.',
  a:'restricted', why:'A list of live weaknesses with instructions. In the wrong hands it is an attack plan — named access only, and never forwarded "for visibility".' },
{ n:'The internal org chart with reporting lines', d:'Available on the employee directory.',
  a:'internal', why:'Genuinely useful internally, and genuinely useful to an attacker building a pretext. Internal, not public.' },
{ n:'Draft M&A term sheet for an unannounced acquisition', d:'Circulating between three people in Corp Dev and outside counsel.',
  a:'restricted', why:'Material non-public information. Restricted, with a deal-team list — this is securities-law territory, not just security policy.' },
{ n:'A recorded customer webinar', d:'Hosted on the public marketing site behind an email form.',
  a:'public', why:'Distributed to anyone who asks. The email gate is lead capture, not access control.' },
{ n:'Support tickets containing customer error logs', d:'Visible to the whole support organisation.',
  a:'confidential', why:'Customer data held on their behalf, often with identifiers buried in the logs. Need-to-know within support, not company-wide.' }
];

/* ================= STAGE 3 — REUSE CASCADE ================= */
var CASCADE = {
  breached:'FitTrackr (a fitness app you signed up for in 2019)',
  breachpw:'Coupa2024!',
  accounts:[
  { icon:'💼', n:'Work SSO account', pw:'Coupa2024!', falls:1,
    why:'Identical password. The moment the FitTrackr dump is cracked, your work account is credential-stuffed automatically — usually within hours, by a bot.' },
  { icon:'📧', n:'Personal email', pw:'Coupa2024?', falls:1,
    why:'One character different. Cracking tools apply "mangling rules" — swap the last symbol, bump the year, capitalise — as a matter of course. Variants are not new passwords.' },
  { icon:'🏦', n:'Personal bank', pw:'Coupa2025!', falls:1,
    why:'Incrementing the year is the single most predictable mangling rule there is. It falls in the same pass.' },
  { icon:'🛒', n:'Shopping site', pw:'!4202apuoC', falls:1,
    why:'Reversal is a standard rule too. Any transformation you can describe in one sentence, a cracking rig already tries.' },
  { icon:'☁️', n:'Cloud storage', pw:'7Kq!vzR2#mDx9Lw', falls:0,
    why:'Unique and random, from a password manager. Unaffected by the breach — this is the only thing that actually contains the damage.' },
  { icon:'📱', n:'Password manager vault', pw:'six unusual words, unique', falls:0,
    why:'Unique and long. Your vault password is the one you must never reuse anywhere, and the one to protect with a hardware key or app-based MFA.' },
  { icon:'🎮', n:'Gaming account', pw:'Coupa2024!!', falls:1,
    why:'Appending a character is rule number one in every mangling ruleset. Same password, longer.' }
  ]
};

/* ================= ENGINE ================= */
var raw=0, rawMax=0, correct=0, total=0, streak=0, best=0, review=[], timer=null;
var stage=1, li=0, ai=0, ASSET_SET;

function bump(n){ raw += n; var e=A.el('hScore'); if(e) e.textContent = Math.round(raw); }
function hudRow(label,val){
  return A.hud([
    ['Score','<span id="hScore">'+Math.round(raw)+'</span>','robin'],
    ['Stage', stage+' / 3',''],
    [label,val,''],
    ['Streak','<span id="hStreak">'+streak+'</span>', streak>1?'good':'']
  ]);
}

function start(){
  ASSET_SET = A.shuffle(ASSETS).slice(0,8);
  rawMax = LEVELS.length*200 + ASSET_SET.length*60 + CASCADE.accounts.length*40;
  crackRound();
}

/* ---- Stage 1 ---- */
function crackRound(){
  if (li >= LEVELS.length){ stage=2; return assetRound(); }
  var L = LEVELS[li], attempts = 0, cleared = false;
  var targetBits = Math.log2(L.target * GUESS_RATE * 2);

  A.el('stage').innerHTML =
    hudRow('Level', (li+1)+' / '+LEVELS.length) +
    '<div class="stagehdr"><span class="eyebrow">Stage 1 · Crack Lab</span>'+
      '<span class="chip">3 attempts &middot; &minus;40 each failed submit</span></div>' +
    '<div class="target"><div class="t">Level '+(li+1)+': '+esc(L.label)+'</div>'+
      '<div class="c">'+esc(L.rule)+' &nbsp;·&nbsp; Attacker: offline rig at 10 billion guesses per second.</div></div>' +
    '<div class="pwfield"><input type="text" id="pw" placeholder="Type a candidate password&hellip;" autocomplete="off" '+
      'autocapitalize="off" spellcheck="false"><button class="icon-btn eye" id="clrBtn" title="Clear">✕</button></div>' +
    '<div class="meter"><i id="mfill"></i></div>' +
    '<div class="rig"><div class="rl"><div><div class="lbl">Time to crack</div>'+
      '<div class="big" id="ttc">—</div></div>'+
      '<div style="text-align:right"><div class="lbl">Entropy</div>'+
      '<div class="big" id="ent" style="font-size:25px">0 bits</div>'+
      '<div class="lbl" style="letter-spacing:.06em">target '+Math.ceil(targetBits)+' bits</div></div></div>'+
      '<div class="bits" id="bits"></div></div>' +
    '<div class="flags" id="flags"></div>' +
    '<div class="row" style="margin-top:18px"><button class="btn primary" id="subBtn" disabled>Submit password</button>'+
      '<button class="btn ghost" id="skipBtn">Skip level</button></div>' +
    '<div id="fb" style="margin-top:16px"></div>';

  var inp = A.el('pw'), bitsEl = A.el('bits');
  for (var b=0;b<48;b++) bitsEl.insertAdjacentHTML('beforeend','<i></i>');
  var pips = bitsEl.querySelectorAll('i');
  var tgtPip = Math.round((targetBits/110)*48);
  if (pips[tgtPip]) pips[tgtPip].classList.add('tgt');

  function paint(){
    var pw = inp.value;
    var r = analyze(pw);
    var viol = pw ? L.check(pw) : null;
    var pass = !viol && r.seconds >= L.target;
    A.el('ttc').textContent = pw ? fmtTime(r.seconds) : '—';
    A.el('ttc').className = 'big'+(pass?' won':'');
    A.el('ent').textContent = Math.round(r.bits)+' bits';
    var pctBar = A.clamp(r.bits/targetBits,0,1)*100;
    var mf = A.el('mfill'); mf.style.width = pctBar+'%'; mf.className = pass?'won':'';
    for (var k=0;k<48;k++){
      var on = k < Math.round((r.bits/110)*48);
      pips[k].className = (k===tgtPip?'tgt':'') + (on&&k!==tgtPip?' on':'');
    }
    var fl = r.flags.slice();
    if (viol) fl.unshift({bad:1, t:'<strong>Rule:</strong> '+esc(viol)});
    if (pass) fl.unshift({bad:0, t:'<strong>Target cleared.</strong> This survives '+fmtTime(r.seconds)+' against the rig. Submit it.'});
    A.el('flags').innerHTML = fl.slice(0,5).map(function(f){
      return '<div class="fg'+(f.bad?'':' good')+'">'+f.t+'</div>'; }).join('');
    A.el('subBtn').disabled = !pw || !!viol;
    cleared = pass;
  }
  inp.oninput = paint;
  A.el('clrBtn').onclick = function(){ inp.value=''; paint(); inp.focus(); };
  inp.focus(); paint();

  function finishLevel(ok, pw){
    var r = analyze(pw||'');
    total++;
    if (ok){
      var margin = A.clamp(Math.log2(Math.max(r.seconds,1)/L.target)/10, 0, 1);
      var pts = 150 + Math.round(50*margin);
      bump(pts); correct++; streak++; best=Math.max(best,streak); A.SFX.win();
    } else { streak=0; A.SFX.lose(); }
    inp.disabled = true;
    A.el('subBtn').classList.add('hidden'); A.el('skipBtn').classList.add('hidden');
    A.el('fb').innerHTML =
      '<div class="verdict '+(ok?'ok':'no')+'"><div class="vh">'+
        (ok?'✓ Level cleared <span class="chip good">+'+pts+'</span>':'✕ Level failed')+'</div>'+
        '<p>'+(ok?'Your password holds for <strong>'+fmtTime(r.seconds)+'</strong> at 10 billion guesses a second.'
                 :'You did not reach '+esc(L.label)+'. No shame in it — this is why generated passwords exist.')+'</p>'+
        '<div class="why">'+esc(L.teach)+'</div>'+
        '<button class="btn primary" id="nextBtn" style="margin-top:16px">Continue &rarr;</button></div>';
    review.push({ok:ok, q:'Crack Lab level '+(li+1)+': '+L.label, a:L.teach});
    A.el('nextBtn').onclick = function(){ li++; A.SFX.select(); crackRound(); window.scrollTo({top:0,behavior:'smooth'}); };
  }

  A.el('subBtn').onclick = function(){
    var pw = inp.value;
    if (cleared) return finishLevel(true, pw);
    attempts++;
    bump(-40); A.SFX.bad();
    if (attempts >= 3) return finishLevel(false, pw);
    A.toast('Not strong enough — '+(3-attempts)+' attempt'+(3-attempts>1?'s':'')+' left. &minus;40');
    document.querySelector('.rig').classList.add('shake');
    setTimeout(function(){ document.querySelector('.rig').classList.remove('shake'); },420);
  };
  A.el('skipBtn').onclick = function(){ finishLevel(false, inp.value); };
}

/* ---- Stage 2 ---- */
function assetRound(){
  if (ai >= ASSET_SET.length){ stage=3; return cascadeRound(); }
  var Q = ASSET_SET[ai], LIMIT = 14;

  A.el('stage').innerHTML =
    hudRow('Asset', (ai+1)+' / '+ASSET_SET.length) +
    '<div class="timerbar" id="tbar"><i></i></div>' +
    '<div class="stagehdr"><span class="eyebrow">Stage 2 · Classify &amp; Route</span>'+
      '<span class="chip">14 seconds</span></div>' +
    '<h3 style="margin-bottom:14px">How is this classified?</h3>' +
    '<div class="assetcard"><div class="an">'+esc(Q.n)+'</div><div class="ad">'+esc(Q.d)+'</div></div>' +
    '<div class="grid4" id="tiers">'+Object.keys(TIERS).map(function(k){
      return '<button class="btn ghost" data-k="'+k+'">'+TIERS[k].label+'<small>'+TIERS[k].sub+'</small></button>';
    }).join('')+'</div>' +
    '<div id="fb" style="margin-top:16px"></div>';

  function pick(k){
    if (timer) timer.stop();
    var left = timer ? timer.remaining() : 0;
    var ok = k === Q.a; total++;
    if (ok){ var pts = 45 + Math.round((left/LIMIT)*15); bump(pts); correct++; streak++; best=Math.max(best,streak); A.SFX.good(); }
    else { streak=0; A.SFX.bad(); }
    Array.prototype.forEach.call(document.querySelectorAll('#tiers .btn'), function(b){
      b.disabled = true;
      if (b.dataset.k === Q.a) b.style.boxShadow = '0 0 0 2px var(--pistachio)';
    });
    A.el('fb').innerHTML =
      '<div class="verdict '+(ok?'ok':'no')+'"><div class="vh">'+
        (ok?'✓ '+TIERS[Q.a].label+' <span class="chip good">+'+pts+'</span>':'✕ Correct tier: '+TIERS[Q.a].label)+'</div>'+
        '<p>'+esc(Q.why)+'</p>'+
        '<button class="btn primary" id="nextBtn" style="margin-top:14px">Continue &rarr;</button></div>';
    review.push({ok:ok, q:'Classification: '+Q.n, a:Q.why});
    A.el('nextBtn').onclick = function(){ ai++; A.SFX.select(); assetRound(); };
    A.el('nextBtn').focus();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#tiers .btn'), function(b){
    b.onclick = function(){ pick(b.dataset.k); };
  });
  timer = A.Timer(A.el('tbar'), LIMIT, function(){ pick(null); });
}

/* ---- Stage 3 ---- */
function cascadeRound(){
  var picked = {}, LIMIT = 50;
  var fallCount = CASCADE.accounts.filter(function(a){return a.falls;}).length;

  A.el('stage').innerHTML =
    hudRow('Accounts', CASCADE.accounts.length+' at risk') +
    '<div class="timerbar" id="tbar"><i></i></div>' +
    '<div class="stagehdr"><span class="eyebrow">Stage 3 · Reuse Cascade</span></div>' +
    '<h3 style="margin-bottom:6px">'+esc(CASCADE.breached)+' has been breached.</h3>' +
    '<p class="lead" style="font-size:16px;line-height:24px;margin-bottom:4px">The password in that dump was '+
      '<span class="mono" style="color:var(--robin)">'+esc(CASCADE.breachpw)+'</span>. '+
      'Click every other account that an attacker can now get into. There are <strong style="color:var(--robin)">'+fallCount+'</strong>.</p>' +
    '<div style="font-size:13px;color:var(--dimmer);margin-top:10px">+40 per correct call &middot; &minus;20 for a wrong one</div>' +
    '<div class="acctlist" id="accts">'+CASCADE.accounts.map(function(a,i){
      return '<button class="acct" data-i="'+i+'"><span class="ic">'+a.icon+'</span>'+
        '<span class="t"><b>'+esc(a.n)+'</b><span>'+esc(a.pw)+'</span></span>'+
        '<span class="st">?</span></button>';
    }).join('')+'</div>' +
    '<div class="row" style="margin-top:16px"><button class="btn ghost" id="doneBtn">Done &rarr;</button></div>' +
    '<div id="fb" style="margin-top:16px"></div>';

  var got = 0;
  Array.prototype.forEach.call(document.querySelectorAll('#accts .acct'), function(btn){
    btn.onclick = function(){
      var i = +btn.dataset.i; if (picked[i]) return; picked[i] = 1;
      var a = CASCADE.accounts[i];
      if (a.falls){ got++; bump(40); A.SFX.good(); btn.className='acct fell';
        btn.querySelector('.st').textContent='COMPROMISED'; A.float(btn,'+40','var(--pistachio)');
        if (got === fallCount) setTimeout(end, 500);
      } else { bump(-20); A.SFX.bad(); btn.className='acct wrongpick';
        btn.querySelector('.st').textContent='SAFE'; A.float(btn,'−20','var(--robin)'); }
    };
  });

  function end(){
    if (timer) timer.stop();
    var db = A.el('doneBtn');
    if (!db || db.classList.contains('hidden')) return;
    db.classList.add('hidden');
    total++; if (got === fallCount){ correct++; streak++; best=Math.max(best,streak); A.SFX.great(); } else { streak=0; A.SFX.bad(); }
    Array.prototype.forEach.call(document.querySelectorAll('#accts .acct'), function(btn){
      var i = +btn.dataset.i, a = CASCADE.accounts[i];
      btn.disabled = true;
      if (a.falls && !picked[i]){ btn.className='acct fell'; btn.querySelector('.st').textContent='MISSED'; }
      if (!a.falls && !picked[i]){ btn.className='acct safe'; btn.querySelector('.st').textContent='SAFE'; }
    });
    A.el('fb').innerHTML =
      '<div class="verdict '+(got===fallCount?'ok':'no')+'"><div class="vh">'+
        (got===fallCount?'✓ Full cascade mapped':'You found '+got+' of '+fallCount)+'</div>'+
        '<ul style="margin:6px 0 0 18px;font-size:14px;line-height:23px;color:rgba(255,255,255,.88)">'+
          CASCADE.accounts.map(function(a){ return '<li style="margin-bottom:8px"><strong>'+esc(a.n)+'</strong> — '+esc(a.why)+'</li>'; }).join('')+
        '</ul>'+
        '<div class="why">The whole lesson in one line: a password is only unique if no describable transformation connects it to another one. '+
        'That is not something a person can maintain by hand — which is what a password manager is for.</div>'+
        '<button class="btn primary" id="nextBtn" style="margin-top:16px">See results &rarr;</button></div>';
    review.push({ok:got===fallCount, q:'Reuse cascade: one breach, seven accounts',
      a:'Cracking rigs apply mangling rules automatically — append a character, bump the year, swap the symbol, reverse the string. A "variant" is the same password. Only unique, generated passwords stop the cascade.'});
    A.el('nextBtn').onclick = done;
  }
  A.el('doneBtn').onclick = end;
  timer = A.Timer(A.el('tbar'), LIMIT, end);
}

function done(){
  A.finish({
    score: Math.round(A.clamp(raw/rawMax,0,1)*1000),
    maxScore: 1000,
    accuracy: Math.round((correct/total)*100),
    statLabel:'Best streak', statValue:best,
    review: review
  });
}

A.boot({
  week:3, topic:'Data Security & Passwords', title:'Vault Breaker',
  tagline:'Go up against a cracking rig that guesses ten billion times a second, sort real data into the right tier before the clock runs out, and watch one reused password take down six accounts.',
  rounds:12, minutes:9, maxScore:1000,
  brief:[
    '<strong>Stage 1 — Crack Lab:</strong> three levels. Type a password and watch the rig estimate how long it survives, live. Three submits per level.',
    '<strong>Stage 2 — Classify &amp; Route:</strong> eight real data assets, 14 seconds each. Public, Internal, Confidential or Restricted.',
    '<strong>Stage 3 — Reuse Cascade:</strong> one breach. Work out which of your other accounts just fell with it.',
    'Nothing you type is sent anywhere — the analysis runs entirely in your browser. Still, don\'t type a password you actually use.',
    'Level 3 is the one worth staying for. It changes what most people believe about passwords.'
  ],
  onStart:start
});
})();
</script>
</body>
